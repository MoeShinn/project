<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dự án của tôi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--ink:#14213d;--muted:#5b6b86;--card:rgba(255,255,255,.72);--line:rgba(20,33,61,.12);--accent:#2f5bff;--o1:#7aa7ff;--o2:#6ee7d4;--o3:#c4a8ff;--ob:.55;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0f20;--ink:#e8ecf8;--muted:#97a3c4;--card:rgba(22,30,60,.62);--line:rgba(255,255,255,.1);--accent:#8aabff;--o1:#3a56d4;--o2:#118a7e;--o3:#6a3fc4;--ob:.5;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a0f20;--ink:#e8ecf8;--muted:#97a3c4;--card:rgba(22,30,60,.62);--line:rgba(255,255,255,.1);--accent:#8aabff;--o1:#3a56d4;--o2:#118a7e;--o3:#6a3fc4;--ob:.5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;transition:background .4s,color .4s}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--ob);will-change:transform}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:var(--o1);left:-10vmax;top:-12vmax;animation:d1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){width:38vmax;height:38vmax;background:var(--o2);right:-12vmax;top:20vh;animation:d2 32s ease-in-out infinite alternate}
.bg i:nth-child(3){width:34vmax;height:34vmax;background:var(--o3);left:25vw;bottom:-16vmax;animation:d3 38s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(var(--line) 1px,transparent 1.5px) 0 0/28px 28px;animation:grid 40s linear infinite}
@keyframes d1{to{transform:translate(18vw,14vh) scale(1.2)}}
@keyframes d2{to{transform:translate(-20vw,-12vh) scale(.85)}}
@keyframes d3{to{transform:translate(-16vw,-18vh) scale(1.15)}}
@keyframes grid{to{background-position:28px 28px}}
@media (prefers-reduced-motion:reduce){.bg i,.bg::after{animation:none}}
.wrap{max-width:1120px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 64px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
h1{font:800 clamp(2.2rem,6vw,3.8rem)/1.02 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:0}
.sub{color:var(--muted);margin:8px 0 0}
button,select,input{font:inherit;color:inherit}
.icon{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);cursor:pointer;display:grid;place-items:center;transition:transform .25s}
.icon:hover{transform:rotate(18deg)}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.sun{display:none}
:root[data-theme=dark] .sun{display:block}:root[data-theme=dark] .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sun{display:block}:root:not([data-theme=light]) .moon{display:none}}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar input,.bar select{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);padding:0 16px;outline:none}
.bar input{flex:1 1 240px}
.bar select{flex:0 1 230px;cursor:pointer}
.bar :focus-visible,.card:focus-visible,.icon:focus-visible,.x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{color:var(--muted);font-size:.9rem;margin:0 2px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card);backdrop-filter:blur(14px);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.th{aspect-ratio:16/10;background:linear-gradient(135deg,var(--o1),var(--o3));display:grid;place-items:center;font:800 3.4rem "Bricolage Grotesque",sans-serif;color:#fff;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.meta{padding:14px 16px 16px}
.meta b{display:block;font:700 1.12rem/1.25 "Bricolage Grotesque",sans-serif}
.meta small{color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px 0}
dialog{width:min(1100px,96vw);height:min(760px,90vh);padding:0;border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);overflow:hidden}
dialog::backdrop{background:rgba(5,8,20,.65);backdrop-filter:blur(4px)}
dialog[open]{display:flex;flex-direction:column}
.dh{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh a{color:var(--accent);font-size:.9rem}
.x{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;padding:0 6px}
iframe{flex:1;border:0;width:100%;background:#fff}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <div>
      <h1>Dự án của tôi</h1>
      <p class="sub">Chọn một dự án để chơi hoặc xem.</p>
    </div>
    <button class="icon" id="theme" aria-label="Đổi giao diện sáng/tối">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="Tìm theo tên hoặc id (có dấu hay không đều được)" aria-label="Tìm dự án">
    <select id="sort" aria-label="Sắp xếp">
      <option value="new">Ngày phát hành: mới nhất</option>
      <option value="old">Ngày phát hành: cũ nhất</option>
      <option value="az">Tên A–Z</option>
      <option value="za">Tên Z–A</option>
    </select>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <main class="grid" id="grid"></main>
</div>
<dialog id="dlg">
  <div class="dh"><b id="dt"></b><a id="dopen" target="_blank" rel="noopener">Mở tab mới</a><button class="x" id="dx" aria-label="Đóng">×</button></div>
  <iframe id="fr" allow="fullscreen; autoplay; gamepad" title="Dự án"></iframe>
</dialog>
<script>
const $ = s => document.querySelector(s);
let items = [];
const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const path = (folder, p) => encodeURI(folder + '/' + String(p).replace(/^\/+/, ''));

// Giao diện sáng/tối
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
};

// Nạp dữ liệu: projects.json, nếu chưa có thì gọi GitHub API
async function load() {
  try {
    const r = await fetch('projects.json', { cache: 'no-cache' });
    if (!r.ok) throw 0;
    return await r.json();
  } catch (e) {
    const h = location.hostname;
    if (!h.endsWith('github.io')) throw new Error('Chưa có projects.json');
    const owner = h.split('.')[0], repo = location.pathname.split('/')[1] || h;
    const root = await (await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`)).json();
    const dirs = root.filter(x => x.type === 'dir' && !x.name.startsWith('.'));
    const out = await Promise.all(dirs.map(async d => {
      try {
        const o = await (await fetch(`${d.name}/option.json`)).json();
        return { id: o.id || d.name, name: o.name || d.name, thumbnail: o.thumbnail || '', date: o.date || '', display: o.display || 'iframe', entry: o.entry || 'index.html', folder: d.name };
      } catch (e) { return null; }
    }));
    return out.filter(Boolean);
  }
}

function render() {
  const q = norm($('#q').value.trim()), s = $('#sort').value;
  const list = items.filter(p => !q || norm(p.name + ' ' + p.id + ' ' + p.folder).includes(q));
  const byName = (a, b) => a.name.localeCompare(b.name, 'vi');
  const byDate = (a, b) => (a.date || '').localeCompare(b.date || '');
  list.sort(s === 'az' ? byName : s === 'za' ? (a, b) => byName(b, a) : s === 'old' ? byDate : (a, b) => byDate(b, a));
  $('#count').textContent = `${list.length} / ${items.length} dự án`;
  $('#grid').innerHTML = list.length ? list.map((p, i) => {
    const url = path(p.folder, p.entry);
    const th = p.thumbnail ? `<img src="${path(p.folder, p.thumbnail)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(p.name[0] || '?').toUpperCase()}'))">` : esc((p.name[0] || '?').toUpperCase());
    const tgt = p.display === 'newtab' ? ' target="_blank" rel="noopener"' : '';
    return `<a class="card" href="${url}"${tgt} data-i="${items.indexOf(p)}"><div class="th">${th}</div><div class="meta"><b>${esc(p.name)}</b><small>${esc(p.date || 'Chưa có ngày')}</small></div></a>`;
  }).join('') : '<p class="empty">Không tìm thấy dự án nào khớp. Thử bỏ bớt từ khóa.</p>';
}

$('#grid').onclick = e => {
  const a = e.target.closest('.card'); if (!a) return;
  const p = items[a.dataset.i];
  if (p.display === 'iframe') {
    e.preventDefault();
    $('#dt').textContent = p.name;
    $('#dopen').href = a.getAttribute('href');
    $('#fr').src = a.getAttribute('href');
    $('#dlg').showModal();
  }
};
const close = () => { $('#dlg').close(); };
$('#dx').onclick = close;
$('#dlg').addEventListener('close', () => { $('#fr').src = 'about:blank'; });
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) close(); });
$('#q').oninput = render;
$('#sort').onchange = render;

load().then(d => { items = d; render(); })
  .catch(() => { $('#grid').innerHTML = '<p class="empty">Chưa đọc được danh sách. Hãy chạy Action “Cập nhật danh mục” để tạo projects.json.</p>'; });
</script>
</body>
</html>
