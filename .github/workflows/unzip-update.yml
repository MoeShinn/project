name: Giải nén update
on:
  push:
    branches: [main]
    paths: ['update/*.zip']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unzip-update
  cancel-in-progress: false
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén các zip trong update/ ra gốc repo
        run: |
          shopt -s nullglob nocaseglob
          zips=(update/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Không có file zip nào trong update/"
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Đang giải nén: $z"
            unzip -o -q "$z" -x '.git/*' '__MACOSX/*' -d .
            rm -f "$z"
          done

      - name: Cập nhật danh mục (nếu có)
        run: |
          if [ -f scripts/build-projects.mjs ]; then node scripts/build-projects.mjs; fi

      - name: Commit thay đổi
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: giải nén update" && git push)
