<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Stickman Runner</title>
<style>
/* ====== Giao diện pixel cho Pixel Stickman Runner ====== */
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; font-family: "Courier New", Courier, monospace; color: #fff; }
button { font-family: inherit; cursor: pointer; outline: none; -webkit-appearance: none; appearance: none; }
.hidden { display: none !important; }

#stage { position: absolute; left: 50%; top: 50%; width: 960px; height: 540px; transform-origin: center center; overflow: hidden; background: #111; }
#cv { display: block; width: 960px; height: 540px; image-rendering: pixelated; image-rendering: crisp-edges; }
img { image-rendering: pixelated; image-rendering: crisp-edges; -webkit-user-drag: none; }

/* chữ viền đen kiểu game */
.outline, #hud-score, #hud-high, #hud-combo, h1, h2, .chip b, #over-score, #over-new, .hint { text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }

/* ---- HUD ---- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud-left { position: absolute; left: 22px; top: 14px; }
#hud-score { font-size: 46px; font-weight: bold; line-height: 1; letter-spacing: 2px; }
#hud-high { font-size: 18px; color: #ffe27a; margin-top: 4px; }
.chips { display: flex; gap: 10px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(10, 12, 30, 0.55); border: 3px solid #000; border-radius: 10px; padding: 3px 10px; font-size: 20px; }
.chip img { height: 24px; width: auto; }
.chip.big { font-size: 24px; padding: 5px 14px; } .chip.big img { height: 30px; }
#hud-combo { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font-size: 40px; font-weight: bold; color: #ffd84a; opacity: 0; transition: opacity .2s; }
#hud-combo.show { opacity: 1; animation: pop .25s; }
@keyframes pop { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
#btn-pause { position: absolute; right: 22px; top: 16px; pointer-events: auto; display: flex; gap: 8px; align-items: center; justify-content: center; }
#btn-pause i { display: block; width: 8px; height: 26px; background: #fff; border: 2px solid #000; }

/* ---- nút vuông bo góc (nhảy / trượt) ---- */
.sq { position: relative; width: 124px; height: 124px; border-radius: 20px; background: rgba(20, 26, 52, 0.6); border: 5px solid rgba(255, 255, 255, 0.9); box-shadow: 0 6px 0 rgba(0, 0, 0, 0.55); padding: 0; color: #fff; pointer-events: auto; touch-action: none; }
.sq.small { width: 64px; height: 64px; border-radius: 14px; border-width: 4px; }
.sq svg { width: 62px; height: 62px; }
.sq.down, .sq:active { background: rgba(255, 216, 74, 0.55); transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.55); }
.key { position: absolute; right: 8px; bottom: 4px; font-style: normal; font-weight: bold; font-size: 22px; color: #fff; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
#controls { position: absolute; left: 26px; bottom: 26px; display: flex; gap: 18px; }
#controls .sq { display: flex; align-items: center; justify-content: center; }

/* ---- nút kĩ năng tròn (bên phải, xếp dọc) ---- */
#skills { position: absolute; right: 30px; bottom: 26px; display: flex; flex-direction: column-reverse; gap: 22px; }
.skill { position: relative; width: 104px; height: 104px; border-radius: 50%; border: 0; padding: 0; background: transparent; pointer-events: auto; touch-action: none; }
.skill .ico { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 5px solid #fff; background: #222; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.55); }
.skill .ico img { width: 100%; height: 100%; display: block; }
.skill.off .ico { filter: grayscale(1) brightness(0.8); opacity: 0.45; }
.skill:active .ico, .skill.down .ico { transform: translateY(4px); }
.skill .cnt { position: absolute; left: -10px; top: -10px; min-width: 34px; height: 34px; line-height: 34px; text-align: center; border-radius: 17px; background: #000; color: #ffe27a; font-size: 22px; border: 3px solid #fff; box-sizing: border-box; padding: 0 5px; }
.skill .key { right: -4px; bottom: -6px; }
.skill .ring { position: absolute; inset: -9px; border-radius: 50%; opacity: 0; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); background: conic-gradient(#ffd84a calc(var(--p, 0) * 1%), transparent 0); }
.skill.active .ring { opacity: 1; }
.skill.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---- màn hình / bảng ---- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.screen.dim { background: rgba(0, 0, 0, 0.55); }
.topbar { position: absolute; left: 22px; right: 22px; top: 16px; display: flex; justify-content: space-between; }
h1 { margin: 0 0 14px; font-size: 62px; line-height: 1.05; text-align: center; color: #ffd84a; letter-spacing: 3px; text-shadow: 5px 5px 0 #c1272d, 7px 7px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000; }
h2 { margin: 0; font-size: 34px; color: #ffd84a; }
h2.big { font-size: 64px; margin-bottom: 14px; } h2.red { color: #ff5a4a; }
.btn { position: relative; min-width: 360px; margin: 9px; padding: 13px 34px; font-size: 32px; font-weight: bold; color: #2a1a00; background: #ffd84a; border: 5px solid #000; border-radius: 6px; box-shadow: 0 7px 0 #000, inset 0 -6px 0 rgba(0, 0, 0, 0.18), inset 0 4px 0 rgba(255, 255, 255, 0.4); }
.btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #000, inset 0 -6px 0 rgba(0, 0, 0, 0.18); }
.btn.blue { background: #5ab0ff; color: #04223f; } .btn.green { background: #6fe06a; color: #06300a; } .btn.red { background: #ff6b5a; color: #3a0600; } .btn.gray { background: #cfd5e6; color: #1b2033; }
.btn.small { min-width: 0; font-size: 22px; padding: 8px 18px; border-width: 4px; margin: 6px; }
.btn[disabled] { filter: grayscale(0.9); opacity: 0.55; cursor: default; }
.row { display: flex; }
.badge { position: absolute; right: -14px; top: -16px; width: 36px; height: 36px; line-height: 36px; border-radius: 50%; background: #ff3b30; color: #fff; border: 4px solid #000; font-size: 24px; text-align: center; }
.hint { margin: 10px 0 0; font-size: 17px; color: #fff; text-align: center; }

.panel { width: 800px; max-height: 500px; box-sizing: border-box; padding: 18px 24px 14px; background: #1f2440; border: 6px solid #000; box-shadow: inset 0 0 0 4px #4a5280; display: flex; flex-direction: column; align-items: center; }
.panel-head { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.tabs { display: flex; gap: 10px; margin: 4px 0 8px; }
.tab { font-size: 22px; font-weight: bold; padding: 6px 22px; background: #39406a; color: #cfd5e6; border: 4px solid #000; border-radius: 6px; }
.tab.on { background: #ffd84a; color: #2a1a00; }
.list { width: 100%; flex: 1; overflow-y: auto; max-height: 330px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.item { display: flex; align-items: center; gap: 16px; background: #2b3260; border: 4px solid #000; border-radius: 8px; padding: 6px 14px; margin-bottom: 6px; }
.item .pv, .item img.pv { width: 58px; height: 58px; image-rendering: pixelated; flex: none; }
.item .pv.round { border-radius: 50%; border: 4px solid #fff; box-sizing: border-box; }
.item .info { flex: 1; font-size: 22px; line-height: 1.25; } .item .info small { display: block; font-size: 16px; color: #aab3d6; }
.item .btn { margin: 0; min-width: 150px; font-size: 22px; padding: 8px 12px; border-width: 4px; }
.bar { height: 14px; background: #10132a; border: 3px solid #000; margin-top: 4px; } .bar i { display: block; height: 100%; background: #6fe06a; }

#over-score { font-size: 72px; font-weight: bold; color: #fff; line-height: 1; }
#over-new { font-size: 26px; color: #ffd84a; margin-top: 8px; }
#over-stats { margin: 12px 0 10px; font-size: 22px; line-height: 1.5; text-align: center; text-shadow: 2px 2px 0 #000; }

#toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); border: 3px solid #fff; border-radius: 10px; padding: 8px 20px; font-size: 22px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; }
#loading { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 20; }

</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="480" height="270"></canvas>

  <!-- HUD khi đang chơi -->
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="hud-score">0</div>
      <div id="hud-high">KỈ LỤC 0</div>
      <div class="chips">
        <span class="chip"><img data-asset="item_coin" alt=""><b id="hud-coin">0</b></span>
        <span class="chip"><img data-asset="item_star" alt=""><b id="hud-star">0</b></span>
        <span class="chip"><b id="hud-season"></b></span>
      </div>
    </div>
    <div id="hud-combo"></div>
    <button id="btn-pause" class="sq small" aria-label="Tạm dừng"><i></i><i></i></button>
  </div>

  <!-- 2 nút nhảy / trượt (dưới trái) -->
  <div id="controls" class="hidden">
    <button id="btn-jump" class="sq" aria-label="Nhảy">
      <svg viewBox="0 0 24 24"><path d="M12 3 L22 15 H15.5 V22 H8.5 V15 H2 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>
      <em class="key">W</em>
    </button>
    <button id="btn-slide" class="sq" aria-label="Trượt">
      <svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M12 3 L22 15 H15.5 V22 H8.5 V15 H2 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>
      <em class="key">S</em>
    </button>
  </div>

  <!-- 3 nút kĩ năng (bên phải, xếp dọc) -->
  <div id="skills" class="hidden">
    <button class="skill" data-skill="shuriken"><span class="ring"></span><span class="ico"><img data-asset="icon_shuriken" alt=""></span><b class="cnt">0</b><em class="key">F</em></button>
    <button class="skill" data-skill="giant"><span class="ring"></span><span class="ico"><img data-asset="icon_giant" alt=""></span><b class="cnt">0</b><em class="key">G</em></button>
    <button class="skill" data-skill="shield"><span class="ring"></span><span class="ico"><img data-asset="icon_shield_magnet" alt=""></span><b class="cnt">0</b><em class="key">H</em></button>
  </div>

  <!-- Màn hình chính -->
  <div id="scr-menu" class="screen hidden">
    <div class="topbar">
      <span class="chip big"><img data-asset="item_coin" alt=""><b id="menu-coin">0</b></span>
      <span class="chip big"><b id="menu-high">KỈ LỤC 0</b></span>
    </div>
    <h1 id="menu-title">PIXEL<br>STICKMAN RUNNER</h1>
    <button class="btn" id="btn-play">CHƠI</button>
    <button class="btn blue" id="btn-shop">CỬA HÀNG</button>
    <button class="btn green" id="btn-quests">NHIỆM VỤ<span class="badge hidden" id="quest-badge">!</span></button>
    <div class="row">
      <button class="btn small gray" id="btn-sfx">ÂM THANH: BẬT</button>
      <button class="btn small gray hidden" id="btn-music">NHẠC: BẬT</button>
    </div>
    <p class="hint" id="menu-hint">W / Space = nhảy · S = trượt · F / G / H = kĩ năng · Esc = tạm dừng</p>
  </div>

  <!-- Cửa hàng -->
  <div id="scr-shop" class="screen hidden">
    <div class="panel">
      <div class="panel-head">
        <h2>CỬA HÀNG</h2>
        <span class="chip big"><img data-asset="item_coin" alt=""><b id="shop-coin">0</b></span>
      </div>
      <div class="tabs"><button class="tab on" data-tab="items">VẬT PHẨM</button><button class="tab" data-tab="skins">SKIN</button></div>
      <div id="shop-list" class="list"></div>
      <button class="btn small gray" id="btn-shop-back">← QUAY LẠI</button>
    </div>
  </div>

  <!-- Nhiệm vụ -->
  <div id="scr-quests" class="screen hidden">
    <div class="panel">
      <div class="panel-head"><h2>NHIỆM VỤ HẰNG NGÀY</h2><span class="chip big"><img data-asset="item_coin" alt=""><b id="quest-coin">0</b></span></div>
      <div id="quest-list" class="list"></div>
      <p class="hint">Nhiệm vụ làm mới mỗi ngày.</p>
      <button class="btn small gray" id="btn-quests-back">← QUAY LẠI</button>
    </div>
  </div>

  <!-- Tạm dừng -->
  <div id="scr-pause" class="screen dim hidden">
    <h2 class="big">TẠM DỪNG</h2>
    <button class="btn" id="btn-resume">TIẾP TỤC</button>
    <button class="btn red" id="btn-home">VỀ MÀN HÌNH CHÍNH</button>
  </div>

  <!-- Thua -->
  <div id="scr-over" class="screen dim hidden">
    <h2 class="big red">GAME OVER</h2>
    <div id="over-score">0</div>
    <div id="over-new" class="hidden">★ KỈ LỤC MỚI! ★</div>
    <div id="over-stats"></div>
    <button class="btn" id="btn-again">CHƠI LẠI</button>
    <div class="row">
      <button class="btn small blue" id="btn-over-shop">CỬA HÀNG</button>
      <button class="btn small gray" id="btn-over-home">MÀN HÌNH CHÍNH</button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="loading">ĐANG TẢI...</div>
</div>

<script>
/* Hàm tiện ích dùng chung */
(function () {
  var U = {};
  U.rand = function (a, b) { return a + Math.random() * (b - a); };
  U.randi = function (a, b) { return Math.floor(U.rand(a, b + 1)); };
  U.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  U.lerp = function (a, b, t) { return a + (b - a) * t; };
  U.smooth = function (t) { t = U.clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  U.hex2rgb = function (h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  };
  U.mix = function (c1, c2, t) { // trộn 2 màu #hex -> 'rgb()'
    var a = U.hex2rgb(c1), b = U.hex2rgb(c2);
    return 'rgb(' + Math.round(U.lerp(a[0], b[0], t)) + ',' + Math.round(U.lerp(a[1], b[1], t)) + ',' + Math.round(U.lerp(a[2], b[2], t)) + ')';
  };
  U.mixRgb = function (c1, c2, t) { // trộn 2 màu 'rgb(...)' hoặc #hex
    var p = function (c) { return c.charAt(0) === '#' ? U.hex2rgb(c) : c.match(/\d+/g).map(Number); };
    var a = p(c1), b = p(c2);
    return 'rgb(' + Math.round(U.lerp(a[0], b[0], t)) + ',' + Math.round(U.lerp(a[1], b[1], t)) + ',' + Math.round(U.lerp(a[2], b[2], t)) + ')';
  };
  U.pickWeighted = function (obj) {
    var sum = 0, k;
    for (k in obj) sum += obj[k];
    var r = Math.random() * sum;
    for (k in obj) { r -= obj[k]; if (r <= 0) return k; }
    return Object.keys(obj)[0];
  };
  U.todayKey = function () {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  };
  U.hashStr = function (s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  U.rng = function (seed) { // mulberry32
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  U.isTouch = function () {
    return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  };
  U.rectsOverlap = function (a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  };
  window.U = U;
})();

<script>
/* Lưu dữ liệu vào trình duyệt (localStorage). Lỗi thì giữ trong bộ nhớ tạm. */
(function () {
  var KEY = 'pixel_stickman_runner_save_v1';
  var C = window.GAME_CONFIG;

  function defaults() {
    return {
      coins: C.start.coins,
      inv: { shuriken: C.start.shuriken, giant: C.start.giant, shield: C.start.shield },
      high: 0,
      skins: { owned: ['classic'], equipped: 'classic' },
      quests: { date: '', list: [] },
      settings: { sfx: C.sfx.enabled, music: true },
      stats: { runs: 0, meters: 0 }
    };
  }
  function merge(base, extra) {
    for (var k in extra) {
      if (extra[k] && typeof extra[k] === 'object' && !Array.isArray(extra[k]) && base[k] && typeof base[k] === 'object') merge(base[k], extra[k]);
      else base[k] = extra[k];
    }
    return base;
  }

  var Save = { data: defaults() };

  Save.load = function () {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) merge(Save.data, JSON.parse(raw));
    } catch (e) { /* bỏ qua */ }
    if (!Save.data.skins.owned || Save.data.skins.owned.indexOf('classic') < 0) Save.data.skins.owned = ['classic'];
  };
  Save.save = function () {
    try { window.localStorage.setItem(KEY, JSON.stringify(Save.data)); } catch (e) { /* bỏ qua */ }
  };
  Save.reset = function () { Save.data = defaults(); Save.save(); };

  Save.count = function (id) { return Save.data.inv[id] || 0; };
  Save.addInv = function (id, n) {
    var max = C.maxStack[id] || 99;
    var before = Save.data.inv[id] || 0;
    Save.data.inv[id] = Math.min(max, before + n);
    Save.save();
    return Save.data.inv[id] - before; // số lượt thực sự cộng được
  };
  Save.useInv = function (id) {
    if ((Save.data.inv[id] || 0) <= 0) return false;
    Save.data.inv[id]--; Save.save(); return true;
  };
  Save.addCoins = function (n) { Save.data.coins = Math.max(0, Save.data.coins + n); Save.save(); };

  window.Save = Save;
  Save.load();
})();

</script>
<script>
/* Âm thanh: hiệu ứng 8-bit tạo bằng WebAudio + nhạc nền (url trong config) */
(function () {
  var C = window.GAME_CONFIG;
  var A = { ctx: null, master: null, music: null, chip: null };

  A.init = function () { // gọi trong lần bấm đầu tiên của người chơi
    if (!A.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      A.ctx = new AC();
      A.master = A.ctx.createGain();
      A.master.gain.value = C.sfx.volume;
      A.master.connect(A.ctx.destination);
    }
    if (A.ctx.state === 'suspended') A.ctx.resume();
  };
  A.sfxOn = function () { return window.Save.data.settings.sfx; };

  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!A.ctx || !A.sfxOn()) return;
    var t = A.ctx.currentTime + (delay || 0);
    var o = A.ctx.createOscillator(), g = A.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(A.master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, delay, hp) {
    if (!A.ctx || !A.sfxOn()) return;
    var t = A.ctx.currentTime + (delay || 0);
    var n = Math.floor(A.ctx.sampleRate * dur), buf = A.ctx.createBuffer(1, n, A.ctx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = A.ctx.createBufferSource(), g = A.ctx.createGain(), f = A.ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 800;
    s.buffer = buf; g.gain.value = vol || 0.3;
    s.connect(f); f.connect(g); g.connect(A.master); s.start(t);
  }

  var FX = {
    click:  function () { tone(660, 0.06, 'square', 0.18); },
    jump:   function () { tone(320, 0.16, 'square', 0.22, 760); },
    land:   function () { noise(0.05, 0.12, 0, 400); },
    slide:  function () { noise(0.22, 0.16, 0, 1200); },
    throw_: function () { tone(900, 0.12, 'triangle', 0.22, 300); },
    star:   function () { tone(1200, 0.07, 'square', 0.14); tone(1600, 0.08, 'square', 0.14, null, 0.05); },
    coin:   function () { tone(988, 0.07, 'square', 0.2); tone(1319, 0.16, 'square', 0.2, null, 0.07); },
    gift:   function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.12, 'square', 0.2, null, i * 0.07); }); },
    skill:  function () { [392, 523, 659].forEach(function (f, i) { tone(f, 0.1, 'triangle', 0.25, null, i * 0.05); }); },
    giant:  function () { tone(110, 0.5, 'sawtooth', 0.3, 60); noise(0.4, 0.2, 0, 200); },
    shield: function () { tone(500, 0.3, 'sine', 0.3, 1000); },
    pop:    function () { tone(900, 0.18, 'sawtooth', 0.25, 120); noise(0.2, 0.2, 0, 500); },
    smash:  function () { noise(0.16, 0.3, 0, 300); tone(220, 0.12, 'square', 0.2, 70); },
    die:    function () { tone(440, 0.6, 'sawtooth', 0.3, 50); noise(0.35, 0.25, 0, 300); },
    buy:    function () { tone(784, 0.07, 'square', 0.2); tone(1047, 0.07, 'square', 0.2, null, 0.07); tone(1568, 0.14, 'square', 0.2, null, 0.14); },
    deny:   function () { tone(160, 0.2, 'square', 0.25, 110); },
    combo:  function () { tone(880, 0.06, 'square', 0.18); tone(1175, 0.1, 'square', 0.18, null, 0.06); }
  };
  A.play = function (name) { if (FX[name]) FX[name](); };

  /* ---- Nhạc nền ---- */
  A.startMusic = function () {
    A.stopMusic();
    if (!window.Save.data.settings.music) return;
    var url = (C.music.url || '').trim();
    if (url) {
      try {
        A.music = new window.Audio(url);
        A.music.loop = C.music.loop !== false;
        A.music.volume = C.music.volume;
        var p = A.music.play(); if (p && p.catch) p.catch(function () {});
      } catch (e) { /* bỏ qua */ }
    } else if (C.music.chiptuneWhenNoUrl && A.ctx) {
      startChip();
    }
  };
  A.stopMusic = function () {
    if (A.music) { try { A.music.pause(); } catch (e) {} A.music = null; }
    if (A.chip) { clearInterval(A.chip.timer); A.chip = null; }
  };
  A.setMusicVolumeDuck = function (duck) {
    if (A.music) A.music.volume = C.music.volume * (duck ? 0.35 : 1);
  };

  function startChip() {
    var bass = [110, 110, 165, 110, 147, 147, 196, 147], lead = [440, 523, 659, 523, 587, 698, 880, 698];
    var step = 0, tempo = 0.19;
    var g = A.ctx.createGain(); g.gain.value = C.music.volume * 0.5; g.connect(A.ctx.destination);
    function note(freq, dur, type, vol, t) {
      var o = A.ctx.createOscillator(), e = A.ctx.createGain();
      o.type = type; o.frequency.value = freq; e.gain.setValueAtTime(vol, t); e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(e); e.connect(g); o.start(t); o.stop(t + dur + 0.02);
    }
    var next = A.ctx.currentTime + 0.1;
    A.chip = { timer: setInterval(function () {
      while (next < A.ctx.currentTime + 0.4) {
        note(bass[step % 8], tempo * 0.9, 'triangle', 0.5, next);
        if (step % 2 === 0) note(lead[(step >> 1) % 8], tempo * 0.8, 'square', 0.18, next);
        step++; next += tempo;
      }
    }, 120) };
  }

  window.Sfx = A;
})();

(function () {
  var FILES = {
    ninja_run: 'assets/ninja/ninja_run.png', ninja_jump: 'assets/ninja/ninja_jump.png',
    ninja_slide: 'assets/ninja/ninja_slide.png', ninja_throw: 'assets/ninja/ninja_throw.png',

    obstacle_crate_a: 'assets/obstacles/obstacle_crate_a.png', obstacle_crate_b: 'assets/obstacles/obstacle_crate_b.png',
    obstacle_spikes: 'assets/obstacles/obstacle_spikes.png', obstacle_rock: 'assets/obstacles/obstacle_rock.png',
    obstacle_bird: 'assets/obstacles/obstacle_bird.png', obstacle_drone: 'assets/obstacles/obstacle_drone.png',
    item_star: 'assets/items/item_star.png', item_coin: 'assets/items/item_coin.png',
    item_giftbox: 'assets/items/item_giftbox.png', item_shuriken: 'assets/items/item_shuriken.png',
    item_magnet_shield: 'assets/items/item_magnet_shield.png', fx_shield: 'assets/items/fx_shield.png',
    icon_shuriken: 'assets/items/icon_shuriken.png', icon_giant: 'assets/items/icon_giant.png',
    icon_shield_magnet: 'assets/items/icon_shield_magnet.png'
  };
  var FRAMES = { ninja_run: 6, ninja_jump: 2, ninja_throw: 2, ninja_giant: 6, obstacle_bird: 2, obstacle_drone: 2 };
  var FALLBACK = { ninja_run: [384, 64], ninja_jump: [128, 64], ninja_slide: [64, 64], ninja_throw: [128, 64], ninja_giant: [576, 96] };

  var Assets = { img: {}, frames: FRAMES, cache: {} };

  Assets.url = function (name) {
    var emb = window.EMBEDDED_ASSETS;
    return (emb && emb[name]) ? emb[name] : FILES[name];
  };
  function placeholder(name) { // thiếu ảnh -> hình tạm để game vẫn chạy
    var sz = FALLBACK[name] || [24, 24], c = document.createElement('canvas');
    c.width = sz[0]; c.height = sz[1];
    var x = c.getContext('2d'); x.fillStyle = '#ff00ff'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#000'; x.fillRect(2, 2, c.width - 4, c.height - 4);
    return c;
  }
  Assets.load = function () {
    var names = Object.keys(FILES);
    return Promise.all(names.map(function (n) {
      return new Promise(function (res) {
        var im = new Image();
        im.onload = function () { Assets.img[n] = im; res(); };
        im.onerror = function () { Assets.img[n] = placeholder(n); res(); };
        im.src = Assets.url(n);
      });
    }));
  };
  Assets.fw = function (name) { return Assets.img[name].width / (FRAMES[name] || 1); };
  Assets.fh = function (name) { return Assets.img[name].height; };

  // vẽ khung số i của ảnh nhiều khung
  Assets.draw = function (ctx, src, name, i, x, y, flip, scale) {
    var fw = Assets.fw(name), fh = Assets.fh(name), s = scale || 1;
    ctx.drawImage(src || Assets.img[name], i * fw, 0, fw, fh, Math.round(x), Math.round(y), Math.round(fw * s), Math.round(fh * s));
  };

  // ảnh đổi màu skin (dùng blend 'hue', không cần đọc điểm ảnh nên chạy được cả khi mở file trực tiếp)
  Assets.skinned = function (name, hue) {
    var src = Assets.img[name];
    if (hue == null) return src;
    var key = name + '|h' + hue;
    if (Assets.cache[key]) return Assets.cache[key];
    var c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
    var x = c.getContext('2d');
    x.drawImage(src, 0, 0);
    x.globalCompositeOperation = 'hue';
    x.fillStyle = 'hsl(' + hue + ',100%,50%)'; x.fillRect(0, 0, c.width, c.height);
    x.globalCompositeOperation = 'destination-in'; x.drawImage(src, 0, 0);
    Assets.cache[key] = c; return c;
  };
  // ảnh phủ màu (bóng ma đỏ, nhấp nháy khi trúng...)
  Assets.tinted = function (srcImg, keyName, color, alpha) {
    var key = keyName + '|t' + color + alpha;
    if (Assets.cache[key]) return Assets.cache[key];
    var c = document.createElement('canvas'); c.width = srcImg.width; c.height = srcImg.height;
    var x = c.getContext('2d');
    x.drawImage(srcImg, 0, 0);
    x.globalCompositeOperation = 'source-atop';
    x.globalAlpha = alpha; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
    Assets.cache[key] = c; return c;

/* Thế giới nền: bầu trời, ngày/đêm, 4 mùa, núi đồi, mặt đất, hạt thời tiết */

  World.setSeason = function (idx, instant) {

    var span = 14 * 70, ox = off % span;
    World.trees.forEach(function (tr) {
      var x = Math.round(((tr.x - ox) % span + span) % span - 30), base = GY - Math.round(hl[Math.floor((x + off + 200) % hl.length + hl.length) % hl.length]) + 6;

<script>
/* Chướng ngại vật, vật phẩm, phi tiêu, hiệu ứng vỡ và bộ sinh màn chơi */
(function () {

  var W = C.world.width, GY = C.world.groundY;

  // inset = [trái, trên, phải, dưới] thu nhỏ hitbox cho dễ chịu; bottom = khoảng cách từ mặt đất lên đáy vật thể bay
  var OB = {

    crate_b:  { img: 'obstacle_crate_b', kind: 'crate',  inset: [0, 0, 0, 0] },
    spikes:   { img: 'obstacle_spikes',  kind: 'spikes', inset: [5, 5, 5, 0] },
    rock:     { img: 'obstacle_rock',    kind: 'rock',   inset: [6, 7, 6, 0] },
    bird_low: { img: 'obstacle_bird',    kind: 'bird',   inset: [7, 7, 7, 7], bottom: 6,  extraV: 70 },
    bird_mid: { img: 'obstacle_bird',    kind: 'bird',   inset: [7, 7, 7, 7], bottom: 26, extraV: 70 },
    drone:    { img: 'obstacle_drone',   kind: 'drone',  inset: [7, 7, 7, 8], bottom: 36, bob: 3 }
  };
  var DEBRIS = {
    crate: ['#8a5a32', '#b27b45', '#5c3a1c', '#d6a56b'], spikes: ['#555a63', '#8a909b', '#2d3036'],
    rock: ['#7f8890', '#9aa3ab', '#4c545c'], bird: ['#c81f1f', '#8a1a12', '#f0b23a'], drone: ['#6d747d', '#2d3036', '#ff2a2a']
  };

  var E = { obs: [], items: [], shots: [], fx: [], pops: [], sp: null, onBreak: null };

  E.reset = function () {
    E.obs = []; E.items = []; E.shots = []; E.fx = []; E.pops = [];
    E.sp = { gapLeft: W * 0.55, giftTimer: C.gift.intervalSec, pendingGift: false };
  };

  E.hitRect = function (o) {
    var bob = o.bob ? Math.sin(o.t * 3) * o.bob : 0;
    return { x: o.x + o.ins[0], y: o.y + bob + o.ins[1], w: o.w - o.ins[0] - o.ins[2], h: o.h - o.ins[1] - o.ins[3] };
  };

  function addObstacle(type, x) {
    var d = OB[type], img = A.img[d.img], frames = A.frames[d.img] || 1;
    var w = img.width / frames, h = img.height;
    var y = d.bottom ? GY - d.bottom - h : GY - h;
    var o = { type: type, kind: d.kind, img: d.img, frames: frames, x: x, y: y, w: w, h: h, ins: d.inset, extraV: d.extraV || 0, bob: d.bob || 0, t: Math.random() * 6, frame: 0, dead: false };
    E.obs.push(o); return o;
  }

  /* ---------- sinh màn chơi ---------- */

    var S = C.spawn, type = U.pickWeighted(S.weights), x = W + 24, d = OB[type];
    if (d.extraV) x += d.extraV * ((W + 24 - C.player.x) / speed); // chim bay nhanh hơn -> sinh xa hơn cho kịp thời gian phản ứng
    var o = addObstacle(type, x), width = o.w;
    if (type === 'spikes' && speed >= S.doubleSpikesFromSpeed && Math.random() < 0.4) { addObstacle('spikes', x + o.w - 2); width += o.w - 2; }
    var prog = U.clamp((speed - C.speed.base) / 300, 0, 1);
    var gapPx = speed * (U.lerp(S.gapSecStart, S.gapSecMin, prog) + U.rand(0, S.gapRandom));
    E.sp.gapLeft = width + gapPx;
    // vật phẩm
    var groundObs = (o.kind === 'crate' || o.kind === 'spikes' || o.kind === 'rock' || type === 'bird_low');
    var rs = x + width + 28, re = x + E.sp.gapLeft - 28, i, n;
    if (E.sp.pendingGift && re - rs > 20) {

    } else if (groundObs && Math.random() < S.starArcChance) {

      for (i = 0; i < n; i++) { var t = i / (n - 1); addItem('star', x - 36 + t * (width + 72), GY - 20 - Math.sin(Math.PI * t) * (o.h + 34)); }

  E.burst = function (x, y, colors, n, power) {

  E.popup = function (x, y, text, color) { E.pops.push({ x: x, y: y, text: text, color: color || '#fff', life: 0 }); };

    // hạt vỡ + chữ nổi
    for (i = E.fx.length - 1; i >= 0; i--) {
      var f = E.fx[i]; f.life += dt; f.vy += 620 * dt; f.x += f.vx * dt - speed * 0.2 * dt; f.y += f.vy * dt;

  };

  /* ---------- vẽ ---------- */
  E.drawObstacles = function (ctx) {

<script>
/* Ninja: vật lí, hitbox, hoạt ảnh, vẽ (kể cả Khổng Lồ + bóng ma + khiên) */
(function () {
  var C = window.GAME_CONFIG, U = window.U, A = window.Assets, E = window.Entities;
  var P = C.player, GY = C.world.groundY;
  var Pl = {};

  Pl.reset = function () {
    Pl.x = P.x; Pl.feet = GY; Pl.vy = 0; Pl.onGround = true;
    Pl.sliding = false; Pl.slideT = 0; Pl.slideHeld = false; Pl.jumpBuf = 0;
    Pl.dead = false; Pl.spin = 0; Pl.anim = 0; Pl.throwT = 0; Pl.hue = null;
    Pl.giantT = 0; Pl.shieldT = 0; Pl.shieldOn = false; Pl.invulT = 0; Pl.hist = []; Pl.t = 0; Pl.landed = false;
  };
  Pl.isGiant = function () { return Pl.giantT > 0; };
  Pl.pressJump = function () { Pl.jumpBuf = 0.13; };
  Pl.setSlide = function (v) { Pl.slideHeld = v; };

  Pl.hit = function () {
    if (Pl.isGiant()) return { x: Pl.x - 17, y: Pl.feet - 78, w: 34, h: 78 };
    if (Pl.sliding) return { x: Pl.x - 18, y: Pl.feet - P.slideHitH, w: P.slideHitW, h: P.slideHitH };
    return { x: Pl.x - P.hitW / 2, y: Pl.feet - P.hitH, w: P.hitW, h: P.hitH };
  };

  function supportY() { // mặt thùng gỗ có thể đứng lên
    var best = GY, i, o, L = Pl.x - P.hitW / 2 + 1, R = Pl.x + P.hitW / 2 - 1;
    for (i = 0; i < E.obs.length; i++) {
      o = E.obs[i];
      if (o.kind !== 'crate' || o.dead) continue;
      if (o.x < R && o.x + o.w > L && Pl.prevFeet <= o.y + 6) best = Math.min(best, o.y);
    }
    return best;
  }

  Pl.update = function (dt, sfx) {
    Pl.t += dt;
    if (Pl.dead) { Pl.spin += dt * 9; Pl.vy += 1700 * dt; Pl.feet += Pl.vy * dt; return; }
    Pl.anim += dt;
    Pl.jumpBuf = Math.max(0, Pl.jumpBuf - dt);
    Pl.throwT = Math.max(0, Pl.throwT - dt);
    Pl.invulT = Math.max(0, Pl.invulT - dt);
    var giant = Pl.isGiant();

    if (Pl.shieldT > 0) { Pl.shieldT -= dt; if (Pl.shieldT <= 0) { Pl.shieldT = 0; Pl.shieldOn = false; } }

    // trượt
    if (Pl.slideHeld && !Pl.sliding && Pl.onGround && !giant) { Pl.sliding = true; Pl.slideT = P.slideMinSec; sfx('slide'); }
    if (Pl.sliding) {
      Pl.slideT -= dt;
      if (giant || (!Pl.slideHeld && Pl.slideT <= 0)) Pl.sliding = false;
    }
    // nhảy
    if (Pl.jumpBuf > 0 && Pl.onGround) {
      Pl.vy = -P.jumpVelocity; Pl.onGround = false; Pl.jumpBuf = 0; Pl.sliding = false; sfx('jump');
    }
    // trọng lực (giữ nút trượt khi đang rơi = rơi nhanh)
    var g = (!Pl.onGround && Pl.slideHeld && Pl.vy > -80) ? P.fastFallGravity : P.gravity;
    Pl.prevFeet = Pl.feet;
    Pl.vy += g * dt; Pl.feet += Pl.vy * dt;
    var support = giant ? GY : supportY();
    if (Pl.feet >= support) {
      if (!Pl.onGround && Pl.vy > 120) { sfx('land'); Pl.landed = true; }
      Pl.feet = support; Pl.vy = 0; Pl.onGround = true;
    } else Pl.onGround = false;

    // lịch sử vị trí cho bóng ma
    Pl.hist.push({ t: Pl.t, feet: Pl.feet, anim: Pl.anim, air: !Pl.onGround });
    while (Pl.hist.length > 60) Pl.hist.shift();
  };

  function histAt(lag) {
    var target = Pl.t - lag, h = Pl.hist, i;
    for (i = h.length - 1; i >= 0; i--) if (h[i].t <= target) return h[i];
    return h[0] || { feet: Pl.feet, anim: Pl.anim, air: !Pl.onGround };
  }

  function giantFrame(anim, air) { return air ? 2 : Math.floor(anim * 10) % 6; }

  Pl.draw = function (ctx) {
    var hue = Pl.hue, x = Math.round(Pl.x), i;
    if (Pl.dead) {
      var jump = A.skinned('ninja_jump', hue);
      ctx.save(); ctx.translate(x, Math.round(Pl.feet - 30)); ctx.rotate(Pl.spin);
      ctx.drawImage(jump, 0, 0, 64, 64, -30, -32, 64, 64); ctx.restore();
      return;
    }
    var blink = Pl.invulT > 0 && Math.floor(Pl.invulT * 14) % 2 === 0;
    if (Pl.isGiant()) {
      var gs = A.skinned('ninja_giant', hue), ghosts = C.skills.giant.ghosts;
      for (i = ghosts; i >= 1; i--) { // 3 bóng ma đỏ chạy theo sau
        var h = histAt(i * 0.09), tint = A.tinted(gs, 'giant' + hue, '#ff1a1a', 0.6);
        ctx.globalAlpha = 0.42 - i * 0.09;
        ctx.drawImage(tint, giantFrame(h.anim, h.air) * 96, 0, 96, 96, x - 46 - i * 22, Math.round(h.feet - 93), 96, 96);
      }
      ctx.globalAlpha = (Pl.giantT < 1.2 && Math.floor(Pl.giantT * 10) % 2 === 0) ? 0.55 : 1;
      ctx.drawImage(gs, giantFrame(Pl.anim, !Pl.onGround) * 96, 0, 96, 96, x - 46, Math.round(Pl.feet - 93), 96, 96);
      ctx.globalAlpha = 1;
    } else if (!blink) {
      var sheet, frame = 0, name, dx = 30;
      if (!Pl.onGround) { name = 'ninja_jump'; frame = Pl.vy < 0 ? 0 : 1; }
      else if (Pl.sliding) { name = 'ninja_slide'; dx = 31; }
      else if (Pl.throwT > 0) { name = 'ninja_throw'; frame = Pl.throwT > 0.17 ? 0 : 1; }
      else { name = 'ninja_run'; frame = Math.floor(Pl.anim * P.runFps) % 6; }
      sheet = A.skinned(name, hue);
      ctx.drawImage(sheet, frame * 64, 0, 64, 64, x - dx, Math.round(Pl.feet - 62), 64, 64);
    }
    // khiên
    if (Pl.shieldOn) {
      var sh = A.img.fx_shield, k = Pl.isGiant() ? 1.55 : 1, sz = Math.round(sh.width * k), cy = Pl.feet - (Pl.isGiant() ? 46 : 31);
      var a = 0.85 + 0.15 * Math.sin(Pl.t * 6);
      if (Pl.shieldT < 2 && Math.floor(Pl.shieldT * 8) % 2 === 0) a = 0.35;
      ctx.globalAlpha = a; ctx.drawImage(sh, x - Math.round(sz / 2) + 1, Math.round(cy - sz / 2), sz, sz); ctx.globalAlpha = 1;
    }
  };

  window.Player = Pl;
})();

</script>
<script>
/* Nhiệm vụ hằng ngày: chọn theo ngày, lưu tiến độ */
(function () {
  var C = window.GAME_CONFIG, U = window.U, S = window.Save;
  var Q = {};

  Q.def = function (id) {
    for (var i = 0; i < C.quests.pool.length; i++) if (C.quests.pool[i].id === id) return C.quests.pool[i];
    return null;
  };
  Q.ensure = function () {
    var today = U.todayKey(), q = S.data.quests;
    if (q.date === today && q.list && q.list.length) return;
    var rnd = U.rng(U.hashStr(today)), pool = C.quests.pool.slice(), list = [];
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    var used = {};
    for (i = 0; i < pool.length && list.length < C.quests.perDay; i++) { // mỗi loại nhiệm vụ chỉ chọn 1
      if (used[pool[i].type]) continue;
      used[pool[i].type] = true; list.push({ id: pool[i].id, progress: 0, claimed: false });
    }
    S.data.quests = { date: today, list: list }; S.save();
  };
  Q.list = function () {
    Q.ensure();
    return S.data.quests.list.map(function (it, idx) { var d = Q.def(it.id); return { idx: idx, def: d, progress: it.progress, claimed: it.claimed, done: it.progress >= d.goal }; });
  };
  Q.add = function (type, n) {
    Q.ensure();
    S.data.quests.list.forEach(function (it) {
      var d = Q.def(it.id);
      if (d && d.type === type && !it.claimed) it.progress = Math.min(d.goal, it.progress + n);
    });
  };
  Q.setMax = function (type, v) {
    Q.ensure();
    S.data.quests.list.forEach(function (it) {
      var d = Q.def(it.id);
      if (d && d.type === type && !it.claimed) it.progress = Math.min(d.goal, Math.max(it.progress, v));
    });
  };
  Q.claim = function (idx) {
    Q.ensure();
    var it = S.data.quests.list[idx], d = it && Q.def(it.id);
    if (!it || it.claimed || it.progress < d.goal) return 0;
    it.claimed = true; S.addCoins(d.reward); return d.reward;
  };
  Q.pending = function () { return Q.list().filter(function (q) { return q.done && !q.claimed; }).length; };

  window.Quests = Q;
})();

</script>
<script>
/* Cửa hàng: mua vật phẩm kĩ năng và skin */
(function () {
  var C = window.GAME_CONFIG, S = window.Save;
  var Shop = {};

  Shop.skin = function (id) {
    for (var i = 0; i < C.shop.skins.length; i++) if (C.shop.skins[i].id === id) return C.shop.skins[i];
    return C.shop.skins[0];
  };
  Shop.equippedHue = function () { return Shop.skin(S.data.skins.equipped).hue; };

  Shop.buyItem = function (id) {
    var it = C.shop.items.filter(function (x) { return x.id === id; })[0];
    if (!it) return { ok: false, msg: 'Không có vật phẩm' };
    if (S.data.coins < it.price) return { ok: false, msg: 'Không đủ xu' };
    var max = C.maxStack[id] || 99;
    if (S.count(id) >= max) return { ok: false, msg: 'Kho đã đầy (' + max + ')' };
    S.data.coins -= it.price;
    S.addInv(id, it.give); // tự lưu
    return { ok: true, msg: 'Đã mua ' + it.name };
  };
  Shop.buySkin = function (id) {
    var sk = Shop.skin(id);
    if (S.data.skins.owned.indexOf(id) >= 0) return { ok: false, msg: 'Bạn đã có skin này' };
    if (S.data.coins < sk.price) return { ok: false, msg: 'Không đủ xu' };
    S.data.coins -= sk.price; S.data.skins.owned.push(id); S.data.skins.equipped = id; S.save();
    return { ok: true, msg: 'Đã mua skin ' + sk.name };
  };
  Shop.equip = function (id) {
    if (S.data.skins.owned.indexOf(id) < 0) return false;
    S.data.skins.equipped = id; S.save(); return true;
  };

  window.Shop = Shop;
})();

    click('btn-over-home', function () { window.Game.toMenu(); });

    document.querySelectorAll('#scr-shop .tab').forEach(function (t) {
      t.addEventListener('click', function () { window.Sfx.play('click'); UI.renderShop(t.getAttribute('data-tab')); });
    });
    $('shop-list').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
      var act = b.getAttribute('data-act'), id = b.getAttribute('data-id'), r;
      if (act === 'buy-item') r = window.Shop.buyItem(id);
      else if (act === 'buy-skin') r = window.Shop.buySkin(id);
      else if (act === 'equip') r = { ok: window.Shop.equip(id), msg: 'Đã chọn skin' };
      if (r) { window.Sfx.play(r.ok ? 'buy' : 'deny'); UI.toast(r.msg); if (act !== 'buy-item') window.Game.skinChanged(); UI.renderShop(); }
    });
    $('quest-list').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act="claim"]'); if (!b || b.disabled) return;
      var got = window.Quests.claim(parseInt(b.getAttribute('data-id'), 10));
      if (got) { window.Sfx.play('buy'); UI.toast('+' + got + ' xu'); UI.renderQuests(); }
    });
  };

  window.UI = UI;
})();

</script>
<script>
/* Vòng lặp chính, luật chơi, kĩ năng, điểm số, bot demo ở màn hình chính */
(function () {
  var C = window.GAME_CONFIG, U = window.U, S = window.Save, A = window.Assets, Sfx = window.Sfx;
  var W = window.World, E = window.Entities, P = window.Player, Q = window.Quests, Shop = window.Shop, UI = window.UI;
  var GY = C.world.groundY, WW = C.world.width, HH = C.world.height;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var NAME = { shuriken: 'PHI TIÊU', giant: 'KHỔNG LỒ', shield: 'KHIÊN' };
  var DEMO_SPEED = 255;

  var G = { mode: 'boot', shopFromOver: false, shake: 0, hudT: 0 };

  function sfx(n) { if (G.mode !== 'menu') Sfx.play(n); } // màn hình chính (demo) không phát tiếng

  function resetRun(demo) {
    E.reset(); P.reset(); P.hue = Shop.equippedHue(); W.reset(demo);
    G.time = 0; G.speed = C.speed.base; G.meters = 0; G.bonus = 0; G.stars = 0; G.runCoins = 0; G.breaks = 0;
    G.combo = 0; G.comboT = 0; G.cool = 0; G.deadT = 0; G.shake = 0; G.botCool = 0; G.result = null;
  }
  function curSpeed() {
    if (G.mode === 'menu') return DEMO_SPEED;
    var s = C.speed.base + C.speed.accel * G.time;
    if (C.speed.max != null) s = Math.min(s, C.speed.max);
    return P.isGiant() ? s * C.skills.giant.speedMul : s;
  }
  function score() { return Math.floor(G.meters) * C.scoring.perMeter + G.bonus; }

  /* ---------- combo + phá chướng ngại ---------- */
  function onBreak(o, by) {
    var sc = C.scoring;
    G.combo = (G.comboT > 0) ? Math.min(sc.comboMax, G.combo + 1) : 1;
    G.comboT = sc.comboWindowSec;
    var pts = sc.breakBase * G.combo;
    G.bonus += pts; G.breaks++; Q.add('breaks', 1);
    E.popup(o.x + o.w / 2, o.y - 4, '+' + pts, G.combo >= 3 ? '#ff9a3a' : '#fff');
    if (G.combo >= 2) sfx('combo'); else sfx('smash');
  }
  E.onBreak = function (o, by) { if (G.mode === 'playing') onBreak(o, by); };

  /* ---------- kĩ năng ---------- */
  function deny(id) { sfx('deny'); UI.shakeSkill(id); }
  G.useSkill = function (id) {
    if (G.mode !== 'playing' || P.dead) return;
    var n = S.count(id), sk = C.skills;
    if (id === 'shuriken') {
      if (G.cool > 0) return;
      if (n <= 0) return deny(id);
      S.useInv('shuriken'); G.cool = sk.shuriken.cooldownSec; P.throwT = 0.25;
      E.shoot(P.x + 24, P.feet - (P.isGiant() ? 42 : 36), sk.shuriken.speed); sfx('throw_'); Q.add('shurikens', 1);
    } else if (id === 'giant') {
      if (P.isGiant()) return deny(id);
      if (n <= 0) return deny(id);
      S.useInv('giant'); P.giantT = sk.giant.durationSec; P.sliding = false; sfx('giant'); G.shake = 5; Q.add('giant', 1);
      E.burst(P.x, P.feet - 30, ['#ff2a2a', '#ff7a4a', '#ffd84a'], 18, 220);
    } else if (id === 'shield') {
      if (P.shieldT > 0) return deny(id);
      if (n <= 0) return deny(id);
      S.useInv('shield'); P.shieldT = sk.shield.durationSec; P.shieldOn = true; sfx('shield'); Q.add('shield', 1);
    }
    UI.refreshSkills(activeFrac());
  };
  function activeFrac() {
    return { giant: P.giantT > 0 ? P.giantT / C.skills.giant.durationSec : 0, shield: P.shieldT > 0 ? P.shieldT / C.skills.shield.durationSec : 0 };
  }

  /* ---------- nhặt vật phẩm ---------- */
  function collect(it, demo) {
    if (demo) { E.burst(it.x, it.y, ['#ffd84a', '#ffffff'], 4, 70); return; }
    if (it.kind === 'star') {
      G.stars++; G.bonus += C.scoring.star; Q.add('stars', 1); sfx('star'); E.burst(it.x, it.y, ['#ffe27a', '#fff'], 4, 70);
    } else if (it.kind === 'coin') {
      G.runCoins += C.coin.perPickup; Q.add('coins', C.coin.perPickup); sfx('coin'); E.popup(it.x, it.y - 8, '+' + C.coin.perPickup, '#ffd84a');
    } else {
      var id = U.pickWeighted(C.gift.weights), added = S.addInv(id, C.gift.amount[id]);
      sfx('gift'); E.burst(it.x, it.y, ['#ff4a4a', '#4aa0ff', '#ffd84a', '#fff'], 14, 150);
      E.popup(it.x, it.y - 12, added > 0 ? '+' + added + ' ' + NAME[id] : 'KHO ĐẦY!', added > 0 ? '#9dff9a' : '#ff8a8a');
      UI.refreshSkills(activeFrac());
    }
  }

  /* ---------- va chạm ---------- */
  function collide(demo) {
    var hb = P.hit(), giant = P.isGiant(), i, o, r;
    for (i = 0; i < E.obs.length; i++) {
      o = E.obs[i]; if (o.dead) continue;
      r = E.hitRect(o);
      if (!U.rectsOverlap(hb, r)) continue;
      if (giant || demo) {
        E.destroy(o);
        if (giant && !demo) { onBreak(o, 'giant'); G.shake = Math.max(G.shake, 3); }
        continue;
      }
      if (o.kind === 'crate' && P.feet <= o.y + 6) continue;   // đứng/đáp lên mặt thùng thì an toàn
      if (P.invulT > 0) continue;
      if (P.shieldOn) {                                           // khiên đỡ 1 lần
        P.shieldOn = false; P.invulT = 1.0; E.destroy(o); sfx('pop'); G.shake = 4;
        E.popup(P.x, P.feet - 62, 'KHIÊN VỠ!', '#d6b3ff'); UI.refreshSkills(activeFrac()); continue;
      }
      die(); return;
    }
    var ib = { x: hb.x - 4, y: hb.y - 4, w: hb.w + 8, h: hb.h + 8 };
    for (i = 0; i < E.items.length; i++) {
      var it = E.items[i]; if (it.dead) continue;
      if (U.rectsOverlap(ib, { x: it.x - 8, y: it.y - 8, w: 16, h: 16 })) { it.dead = true; collect(it, demo); }
    }
  }

  /* ---------- chết / kết thúc ---------- */
  function die() {
    P.dead = true; P.vy = -380; P.sliding = false; G.mode = 'dead'; G.deadT = 0; G.shake = 9;
    Sfx.play('die'); Sfx.stopMusic(); E.burst(P.x, P.feet - 30, ['#111', '#c8201a', '#5b4030', '#444'], 22, 230);
    UI.playing(true);
  }
  function gameOver() {
    var sc = score(), coins = G.runCoins + Math.floor(sc / 100) * C.scoring.coinsPer100Score, newHigh = sc > S.data.high;
    if (newHigh) S.data.high = sc;
    S.data.stats.runs++; S.data.stats.meters += Math.floor(G.meters);
    Q.add('meters', Math.floor(G.meters)); Q.setMax('score', sc);
    S.addCoins(coins);
    G.result = { score: sc, newHigh: newHigh, meters: Math.floor(G.meters), stars: G.stars, breaks: G.breaks, coins: coins, high: S.data.high };
    G.mode = 'over'; UI.playing(false); UI.renderOver(G.result); UI.show('over');
  }

  /* ---------- bot ở màn hình chính ---------- */
  function bot(dt, speed) {
    var target = null, i, o;
    for (i = 0; i < E.obs.length; i++) { o = E.obs[i]; if (!o.dead && o.x + o.w > P.x - 14 && (!target || o.x < target.x)) target = o; }
    var slideNeeded = false;
    if (target) {
      var dist = target.x - (P.x + 8);
      var lead = speed * 0.3 - (target.w + 16) / 2;
      if (target.type === 'bird_mid' || target.kind === 'drone') {
        if (dist < 34 + speed * 0.12 && target.x + target.w > P.x - 26) slideNeeded = true;
      } else if (dist < lead && dist > -target.w * 0.5 && P.onGround) P.pressJump();
      G.botCool -= dt;
      if (G.botCool <= 0 && dist > 90 && dist < 230 && (target.kind === 'crate' || target.kind === 'bird' || target.kind === 'drone') && Math.random() < dt * 1.6) {
        E.shoot(P.x + 24, P.feet - 36, C.skills.shuriken.speed); P.throwT = 0.25; G.botCool = 1.2;
      }
    }
    P.setSlide(slideNeeded);
  }

  /* ---------- cập nhật mỗi khung ---------- */
  G.update = function (dt) {
    if (G.mode === 'paused' || G.mode === 'boot') return;
    G.shake = Math.max(0, G.shake - dt * 22);
    var playing = G.mode === 'playing', demo = G.mode === 'menu', speed;
    if (playing || demo) {
      speed = curSpeed(); G.speed = speed;
      if (playing) {
        G.time += dt; G.cool = Math.max(0, G.cool - dt);
        G.comboT -= dt; if (G.comboT <= 0 && G.combo > 0) G.combo = 0;
        if (P.giantT > 0) { P.giantT -= dt; if (P.giantT <= 0) { P.giantT = 0; P.invulT = Math.max(P.invulT, 1.0); UI.refreshSkills(activeFrac()); } }
        G.meters += speed * dt / C.scoring.pixelsPerMeter;
      } else { G.botT = (G.botT || 0) + dt; bot(dt, speed); P.throwT = Math.max(0, P.throwT); }
      W.update(dt, speed, G.meters);
      E.update(dt, speed, { px: P.x, py: P.feet - 30, magnet: P.shieldT > 0, magnetR: C.skills.shield.magnetRadius });
      P.update(dt, sfx);
      collide(demo);
      if (P.landed) { P.landed = false; E.burst(P.x, P.feet, ['#d9d2b8', '#a89f86'], 3, 50); }
      if (playing) {
        G.hudT -= dt;
        if (G.hudT <= 0) { G.hudT = 0.08; UI.hud({ score: score(), high: Math.max(S.data.high, score()), coins: G.runCoins, stars: G.stars, combo: G.combo, season: W.seasonName() }); UI.refreshSkills(activeFrac()); }
      }
    } else { // dead / over: thế giới đứng yên, hiệu ứng vẫn chạy
      W.update(dt, 20, G.meters);
      E.update(dt, 0, { noSpawn: true, px: P.x, py: P.feet, magnet: false });
      P.update(dt, function () {});
      if (G.mode === 'dead') { G.deadT += dt; if (G.deadT > 1.0) gameOver(); }
    }
  };

  /* ---------- vẽ ---------- */
  G.render = function () {
    ctx.save();
    if (G.shake > 0.3) ctx.translate(Math.round(U.rand(-G.shake, G.shake) * 0.5), Math.round(U.rand(-G.shake, G.shake) * 0.5));
    W.drawBack(ctx); W.drawGround(ctx);
    E.drawObstacles(ctx); E.drawItems(ctx);
    P.draw(ctx);
    E.drawShots(ctx); E.drawFx(ctx);
    if (P.isGiant() && G.mode === 'playing') { // vạch tốc độ khi hoá Khổng Lồ
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      for (var i = 0; i < 7; i++) ctx.fillRect(Math.floor(U.rand(0, WW)), Math.floor(U.rand(10, GY - 10)), Math.floor(U.rand(18, 40)), 1);
    }
    W.drawFront(ctx);
    ctx.restore();
  };

  /* ---------- điều khiển ---------- */
  G.press = function (a) {
    if (G.mode !== 'playing') return;
    if (a === 'jump') P.pressJump();
    else if (a === 'slide') P.setSlide(true);
  };
  G.release = function (a) { if (a === 'slide') P.setSlide(false); };

  G.startRun = function () {
    Sfx.init(); resetRun(false); G.mode = 'playing'; P.invulT = 0.6;
    UI.show(null); UI.playing(true); Q.ensure(); UI.last = {}; G.hudT = 0; UI.refreshSkills(activeFrac());
    Sfx.startMusic();
  };
  G.bot = bot; // dùng cho kiểm thử tự động
  G.pause = function () {
    if (G.mode !== 'playing') return;
    G.mode = 'paused'; P.setSlide(false); UI.show('pause'); Sfx.setMusicVolumeDuck(true); S.save();
  };
  G.resume = function () {
    if (G.mode !== 'paused') return;
    G.mode = 'playing'; UI.show(null); Sfx.setMusicVolumeDuck(false);
  };
  G.showMenu = function () { UI.refreshMenu(); UI.show('menu'); };
  G.toMenu = function () {
    var wasMenu = G.mode === 'menu';
    G.mode = 'menu'; if (!wasMenu) resetRun(true);
    G.shopFromOver = false; Sfx.stopMusic(); UI.playing(false); G.showMenu(); S.save();
  };
  G.backFromShop = function () {
    if (G.shopFromOver && G.result) { G.shopFromOver = false; UI.renderOver(G.result); UI.show('over'); }
    else G.showMenu();
  };
  G.skinChanged = function () { P.hue = Shop.equippedHue(); };

  function bindKeys() {
    var map = { Space: 'jump', KeyW: 'jump', ArrowUp: 'jump', KeyS: 'slide', ArrowDown: 'slide' };
    var skillKeys = {};
    Object.keys(C.skills).forEach(function (id) { skillKeys['Key' + C.skills[id].key.toUpperCase()] = id; });
    window.addEventListener('keydown', function (e) {
      Sfx.init();
      if (['Space', 'ArrowUp', 'ArrowDown'].indexOf(e.code) >= 0) e.preventDefault();
      if (e.code === 'Escape' || e.code === 'KeyP') { if (G.mode === 'playing') G.pause(); else if (G.mode === 'paused') G.resume(); return; }
      if (e.code === 'Enter' && G.mode === 'menu' && !document.getElementById('scr-menu').classList.contains('hidden')) { UI.tryLandscape(); G.startRun(); return; }
      if (e.code === 'KeyM') { S.data.settings.sfx = !S.data.settings.sfx; S.save(); UI.refreshMenu(); return; }
      if (e.repeat) return;
      if (map[e.code]) G.press(map[e.code]);
      else if (skillKeys[e.code]) G.useSkill(skillKeys[e.code]);
    });
    window.addEventListener('keyup', function (e) { if (map[e.code] === 'slide') G.release('slide'); });
    window.addEventListener('blur', function () { G.release('slide'); if (G.mode === 'playing') G.pause(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden && G.mode === 'playing') G.pause(); });
    window.addEventListener('beforeunload', function () { S.save(); });
  }

  /* ---------- khởi động ---------- */
  var last = 0;
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
    try { G.update(dt); G.render(); } catch (err) { if (window.console) console.error(err); }
    requestAnimationFrame(frame);
  }
  function boot() {
    ctx.imageSmoothingEnabled = false;
    A.load().then(function () {
      W.init(); UI.init(); bindKeys(); Q.ensure();
      resetRun(true); G.mode = 'menu'; G.showMenu();
      document.getElementById('loading').classList.add('hidden');
      requestAnimationFrame(frame);
    });
  }
  window.Game = G;
  boot();
})();

</script>
<!--/SCRIPTS-->
