<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pixel Stickman Runner</title>
<style>
html,body{margin:0;height:100%;background:#0b0b12;overflow:hidden;touch-action:none;font-family:monospace;color:#fff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#box{position:relative;aspect-ratio:16/9;width:min(100vw,177.78vh);--u:6px}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);background:rgba(0,0,0,.45);text-align:center;font-size:calc(var(--u)*3.4)}
.ov.on{display:flex}
h1{margin:0;font-size:calc(var(--u)*8);color:#ffd84a;text-shadow:0 calc(var(--u)*.6) #a33}
h2{margin:0;font-size:calc(var(--u)*6)}
button,select{font:inherit;font-size:calc(var(--u)*3.6);padding:calc(var(--u)*1.2) calc(var(--u)*4);background:#e8e8f0;color:#111;border:calc(var(--u)*.5) solid #111;border-radius:0;cursor:pointer;box-shadow:0 calc(var(--u)*.6) #555;min-width:calc(var(--u)*30)}
button:active{transform:translateY(2px)}
label{display:flex;gap:calc(var(--u)*2);align-items:center;justify-content:space-between;width:calc(var(--u)*60)}
small{opacity:.7;font-size:calc(var(--u)*2.4)}
#tb,#pb{position:absolute;display:none;min-width:0;opacity:.75;border-radius:50%}
#tb{right:2%;bottom:4%;width:calc(var(--u)*14);height:calc(var(--u)*14);padding:0}
#pb{right:2%;top:12%;padding:calc(var(--u)*.8) calc(var(--u)*2)}
#box[data-m=play] #tb,#box[data-m=play] #pb{display:block}
</style></head><body>
<div id="w"><div id="box" data-m="menu">
<canvas id="cv" width="320" height="180"></canvas>
<div class="ov" id="menu"><h1>PIXEL STICKMAN<br>RUNNER</h1><button data-a="play">Chơi</button><button data-a="set">Cài đặt</button><button data-a="rec">Kỷ lục</button><small>Space/↑ nhảy · Shift/↓ trượt · Click/X/Z ném phi tiêu · ESC tạm dừng</small></div>
<div class="ov" id="pause"><h2>Tạm dừng</h2><button data-a="resume">Tiếp tục</button><button data-a="menu">Về màn hình chính</button></div>
<div class="ov" id="over"><h2>Game Over</h2><div id="os"></div><button data-a="play">Chơi lại</button><button data-a="menu">Màn hình chính</button></div>
<div class="ov" id="rec"><h2>Kỷ lục</h2><div id="rs"></div><button data-a="back">Quay lại</button></div>
<div class="ov" id="set"><h2>Cài đặt</h2>
<label>Âm lượng <input id="vol" type="range" min="0" max="1" step=".05"></label>
<label>Tắt tiếng <input id="mute" type="checkbox"></label>
<label>Mùa <select id="sea"><option value="auto">Tự động</option><option value="spring">Xuân</option><option value="summer">Hạ</option><option value="autumn">Thu</option><option value="winter">Đông</option></select></label>
<label>Ngày/đêm <select id="day"><option value="auto">Tự động</option><option value="day">Ban ngày</option><option value="dusk">Hoàng hôn</option><option value="night">Ban đêm</option><option value="dawn">Bình minh</option></select></label>
<label>Hiệu ứng nặng <input id="fx" type="checkbox"></label>
<label>Hiện FPS <input id="fps" type="checkbox"></label>
<button data-a="back">Quay lại</button><small id="ci"></small></div>
<button id="tb">★</button><button id="pb">⏸</button>
</div></div>

<!-- CONFIG riêng: nếu thiếu file thì onerror bỏ qua, game dùng DEFAULT_CONFIG bên dưới -->
<script src="config.js" onerror="window.PSR_CFG_MISSING=1"></script>
<script>
'use strict';
/* ================= CONFIG MẶC ĐỊNH (nhúng sẵn, dùng khi không có config.js) ================= */
const DEFAULT_CONFIG={
 player:{x:44,gravity:1500,jumpVel:440,w:8,h:19,slideW:13,slideH:8},
 hitShrink:0.15,
 speed:{base:110,max:2.9,rampPerSec:0.02,demoMult:1.6},
 levels:[0,250,700,1400],
 scorePerPx:0.1,breakBonus:50,
 spawn:{gapMin:0.85,gapMax:1.7,doubleChance:0.45,doubleGap:0.8},
 power:{checkEvery:5,chance:0.35,minDist:200,darts:3,startDarts:0,slowTime:6,slowFactor:0.55,superTime:5},
 dart:{speed:420,cooldown:0.25},
 env:{dayLength:120,seasonLength:240,demoScale:40},
 gameOverDelay:1.4,pool:400
};
/* Trộn config người dùng vào mặc định: sai kiểu / NaN / số âm / thiếu khóa => giữ mặc định */
function mg(d,u){const o=Array.isArray(d)?[]:{};
 const ok=(a,b)=>typeof a===typeof b&&(typeof a!=='number'||(isFinite(b)&&b>=0));
 for(const k in d){const a=d[k],b=u&&u[k];
  if(Array.isArray(a))o[k]=(Array.isArray(b)&&b.length===a.length&&b.every((x,i)=>ok(a[i],x)))?b.slice():a.slice();
  else if(a&&typeof a==='object')o[k]=mg(a,b);
  else o[k]=ok(a,b)?b:a}
 return o}
let C;try{C=mg(DEFAULT_CONFIG,window.PSR_CONFIG)}catch(e){C=mg(DEFAULT_CONFIG,null)}
C.pool=Math.max(50,C.pool|0);
const CFG_FROM_FILE=!!window.PSR_CONFIG&&!window.PSR_CFG_MISSING;

/* ================= LƯU TRỮ (localStorage, 1 key JSON có version) ================= */
const SKEY='psr_save',SEA=['spring','summer','autumn','winter'],DAY=['day','dusk','night','dawn'];
const DS={version:1,high:0,s:{volume:.6,mute:false,season:'auto',day:'auto',heavyFx:true,fps:false},st:{plays:0,dist:0}};
let save;
try{const j=JSON.parse(localStorage.getItem(SKEY));save=mg(DS,j&&j.version===1?j:null)}catch(e){save=mg(DS,null)}
if(save.s.season!=='auto'&&!SEA.includes(save.s.season))save.s.season='auto';
if(save.s.day!=='auto'&&!DAY.includes(save.s.day))save.s.day='auto';
save.s.volume=Math.min(1,save.s.volume);
const store=()=>{try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}};

/* ================= TRẠNG THÁI ================= */
const W=320,H=180,G=146,$=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),box=$('box');ctx.imageSmoothingEnabled=false;
const r=(x,y,w,h,c)=>{if(c)ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
let mode='menu',obs=[],pk=[],ds=[],score=0,dist=0,t=0,lvl=1,nextIn=300,pwT=5,want=0,slowT=0,superT=0,cd=0,ot=0,shown=0,nb=0,sp=100,bg=0,dayT=0,seaT=0,wacc=0,pi=0,jr=0,sl=false,fpsV=0,fpsN=0,fpsT=0,last=performance.now();
const P={y:G,vy:0,onG:1,darts:0},I={down:false};
const px=()=>C.player.x;
const setMode=m=>{mode=m;box.dataset.m=m};
const show=id=>document.querySelectorAll('.ov').forEach(e=>e.classList.toggle('on',e.id===id));
// Chướng ngại: a=0 đất,1 trên không thấp (nhảy),2 trên cao (trượt); c=độ hở so với đất; b=ném được
const OB={crate:{w:14,h:14,a:0,c:0},spikes:{w:20,h:8,a:0,c:0},rock:{w:18,h:12,a:0,c:0},wheel:{w:14,h:14,a:0,c:0,vx:-70},
 fly:{w:14,h:7,a:1,c:5},drone:{w:16,h:8,a:2,c:15,vx:-30},bob:{w:16,h:8,a:2,c:15,f:5}};

/* ================= ÂM THANH (Web Audio, chỉ khởi tạo sau tương tác) ================= */
let AC=null,MG=null,acTried=0;
function aud(){if(!acTried){acTried=1;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination);vol()}catch(e){AC=null}}
 if(AC&&AC.state==='suspended')AC.resume()}
function vol(){if(MG)MG.gain.value=save.s.mute?0:save.s.volume*.35}
function snd(f,d,ty,to,v){if(!AC||save.s.mute||mode==='menu')return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(v||.4,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(MG);o.start();o.stop(n+d)}catch(e){}}

/* ================= HẠT (object pool dạng vòng) ================= */
const pool=Array.from({length:C.pool},()=>({l:0,x:0,y:0,vx:0,vy:0,g:0,c:'#fff',s:1,sw:0,ph:0}));
function em(x,y,n,c,s,life,g,z,sw){if(!save.s.heavyFx)n=Math.ceil(n/3);
 for(let i=0;i<n;i++){const p=pool[pi=(pi+1)%pool.length],a=Math.random()*6.283,v=Math.random()*s;
  p.x=x;p.y=y;p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v;p.l=life*(.6+Math.random()*.4);p.g=g;p.s=z;p.sw=sw||0;p.ph=Math.random()*6;
  p.c=Array.isArray(c)?c[Math.random()*c.length|0]:c}}

/* ================= MÔI TRƯỜNG: ngày/đêm + 4 mùa ================= */
const SKY=[['#4aa8ff','#bfe6ff'],['#6a3d7a','#ff9a5a'],['#050818','#1a2450'],['#35507a','#ffb89a']].map(a=>a.map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16))));
const NF=[0,.5,1,.5];
const SC=[{g:'#4d8a3a',t:'#8bd16f',h1:'#6fae78',h2:'#8cc596',d:'#3b6e2c'},{g:'#7a8f2f',t:'#b5c94a',h1:'#4f9a4f',h2:'#6bb36b',d:'#5f7324'},
 {g:'#8a6a2c',t:'#c9983c',h1:'#a8703a',h2:'#c28a4a',d:'#6b4f1f'},{g:'#dfe9f2',t:'#fff',h1:'#a7bdd3',h2:'#c3d4e4',d:'#b7c8d8'}];
const WCOL=[['#ffb7c5','#ff8fab'],0,['#d2691e','#c0392b','#e0a030'],['#fff','#dfefff']];
const lc=(a,b,f)=>a.map((v,i)=>Math.round(v+(b[i]-v)*f));
function envT(d){
 dayT=save.s.day==='auto'?(dayT+d/C.env.dayLength)%1:DAY.indexOf(save.s.day)/4;
 seaT=save.s.season==='auto'?(seaT+d/C.env.seasonLength)%1:SEA.indexOf(save.s.season)/4+.01}
function weather(dt){const si=Math.floor(seaT*4)%4;if(si===1)return;wacc+=dt*(save.s.heavyFx?26:6);
 while(wacc>=1){wacc--;const p=pool[pi=(pi+1)%pool.length],cs=WCOL[si];
  p.x=Math.random()*(W+80);p.y=-4;p.vx=-25-Math.random()*25;p.vy=14+Math.random()*16;p.l=9;p.g=0;p.s=si===3?1:2;p.sw=si===3?3:10;p.ph=Math.random()*6;p.c=cs[Math.random()*cs.length|0]}}

/* ================= NHẬP LIỆU ================= */
addEventListener('pointerdown',aud);
addEventListener('keydown',e=>{aud();const k=e.code;
 if(k==='Escape'){if(mode==='play')pause();else if(mode==='pause')resume();else if(mode==='menu'&&!$('menu').classList.contains('on'))show('menu');return}
 if(mode==='over'&&shown&&(k==='Enter'||k==='Space')){e.preventDefault();play();return}
 if(mode!=='play')return;
 if(k==='Space'||k==='ArrowUp'){e.preventDefault();if(!e.repeat)jr=.1}
 else if(k==='ArrowDown'||k==='ShiftLeft'||k==='ShiftRight'){e.preventDefault();I.down=true}
 else if(k==='KeyX'||k==='KeyZ')throwDart()});
addEventListener('keyup',e=>{if(e.code==='ArrowDown'||e.code==='ShiftLeft'||e.code==='ShiftRight')I.down=false});
addEventListener('blur',()=>{I.down=false});
cv.addEventListener('pointerdown',e=>{if(mode!=='play')return;if(e.pointerType==='mouse'){if(e.button===0)throwDart();return}const b=cv.getBoundingClientRect();if(e.clientY-b.top<b.height/2)jr=.1;else I.down=true});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>{I.down=false}));
$('tb').addEventListener('pointerdown',e=>{e.stopPropagation();throwDart()});
$('pb').addEventListener('click',()=>pause());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause();last=performance.now()});
function throwDart(){const dm=mode==='menu';if(mode!=='play'&&!dm)return;if(cd>0)return;if(!dm&&P.darts<=0){snd(150,.08,'square',100,.2);return}
 if(!dm)P.darts--;cd=C.dart.cooldown;ds.push({x:px()+6,y:P.y-(sl?5:12),r:0});snd(900,.08,'square',300,.25)}

/* ================= BOT DEMO (nhìn chướng ngại gần nhất) ================= */
function bot(){I.down=false;let o=null;for(const k of obs)if(k.x+k.w>px()-3&&(!o||k.x<o.x))o=k;if(!o)return;
 const D=OB[o.k],tt=(o.x-(px()+5))/(sp-(o.vx||0));
 if(D.a===2){if(tt<.5&&tt>-.3)I.down=true;return}
 if(o.dec===undefined)o.dec=!D.a&&Math.random()<.5;
 if(o.dec&&tt<.9)throwDart();
 if(tt<.28&&tt>-.1&&P.onG)jr=.1}

/* ================= SPAWNER ================= */
function spawnAt(x,only,L){let a=['crate','spikes'];if(L>=2)a.push('rock','fly','drone');if(L>=3)a.push('wheel','bob');if(only)a=['crate','spikes','rock'];
 const k=a[Math.random()*a.length|0],d=OB[k];
 obs.push({k,x,w:d.w,h:d.h,vx:d.vx||0,ph:Math.random()*6,by:G-d.h-d.c,y:G-d.h-d.c});return k}
function brk(o,pts){o.dead=1;em(o.x+o.w/2,o.y+o.h/2,14,['#fc4','#f84','#fff'],70,.5,120,2);snd(180,.2,'sawtooth',60,.35);if(pts)score+=C.breakBonus}
function pick(k){if(k==='darts')P.darts+=C.power.darts;else if(k==='slow')slowT=C.power.slowTime;else superT=C.power.superTime;
 em(px(),P.y-10,16,['#ff0','#fff','#6cf'],80,.5,0,2);snd(660,.25,'square',1320,.3)}

/* ================= VÒNG LẶP LOGIC ================= */
function newRun(demo){obs=[];pk=[];ds=[];score=0;dist=0;t=0;lvl=1;nextIn=260;pwT=C.power.checkEvery;want=0;slowT=superT=0;cd=0;jr=0;I.down=false;P.y=G;P.vy=0;P.onG=1;P.darts=demo?0:C.power.startDarts;sl=false;
 if(!demo){save.st.plays++;store()}}
function die(){setMode('over');ot=0;shown=0;em(px(),P.y-10,70,'#e02040',70,5,22,2,6);snd(200,.5,'sawtooth',40,.4);
 const s=Math.floor(score);save.st.dist+=Math.floor(dist/10);nb=s>save.high;if(nb)save.high=s;store()}
function showOver(){$('os').innerHTML='Điểm: '+Math.floor(score)+'<br>Kỷ lục: '+save.high+(nb?' ★ MỚI!':'');show('over')}
function step(dt){
 if(mode==='pause')return;
 const dm=mode==='menu';
 envT(dt*(dm?C.env.demoScale:1));weather(dt);
 for(const p of pool)if(p.l>0){p.l-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt+(p.sw?Math.sin(p.l*4+p.ph)*p.sw*dt:0);p.y+=p.vy*dt;if(p.y>H)p.l=0}
 if(mode==='over'){ot+=dt;if(ot>C.gameOverDelay&&!shown){shown=1;showOver()}return}
 t+=dt;cd-=dt;jr-=dt;slowT-=dt;superT-=dt;
 const m=dm?C.speed.demoMult:Math.min(C.speed.max,1+C.speed.rampPerSec*t);
 sp=C.speed.base*m*(slowT>0?C.power.slowFactor:1);bg+=sp*dt;dist+=sp*dt;
 if(dm){bot();P.darts=9}else{score+=sp*dt*C.scorePerPx;const L=C.levels.filter(v=>score>=v).length;
  if(L>lvl){lvl=L;for(let i=0;i<5;i++)em(40+Math.random()*240,20+Math.random()*50,22,['#ff0','#f6f','#6ff','#6f6'],90,1,60,2);snd(500,.4,'square',1500,.3)}}
 // người chơi
 sl=I.down&&!!P.onG;
 if(jr>0&&P.onG){P.vy=-C.player.jumpVel;P.onG=0;jr=0;snd(420,.15,'square',900,.25)}
 P.vy+=C.player.gravity*(I.down&&!P.onG?1.8:1)*dt;P.y+=P.vy*dt;
 if(P.y>=G){if(!P.onG)em(px(),G,6,'#cbb',30,.4,60,1);P.y=G;P.vy=0;P.onG=1}
 if(superT>0&&Math.random()<.5)em(px()+(Math.random()-.5)*8,P.y-10,1,['#ff0','#fff'],40,.25,0,1);
 // spawn chướng ngại
 nextIn-=sp*dt;
 if(nextIn<=0){const L=dm?4:lvl,k=spawnAt(W+20,0,L);nextIn=sp*(C.spawn.gapMin+Math.random()*(C.spawn.gapMax-C.spawn.gapMin));
  if(L>=4&&Math.random()<C.spawn.doubleChance){const d2=sp*C.spawn.doubleGap+OB[k].w+30;spawnAt(W+20+d2,1,L);nextIn+=d2}}
 // spawn hộp bí ẩn (cách chướng ngại ≥ minDist)
 if(!dm){pwT-=dt;if(pwT<=0){if(!want){want=Math.random()<C.power.chance;pwT=C.power.checkEvery}
  if(want&&obs.every(o=>Math.abs(o.x-(W+20))>=C.power.minDist)){want=0;pk.push({x:W+20,y:G-28,k:['darts','slow','super'][Math.random()*3|0],ph:Math.random()*6});nextIn=Math.max(nextIn,C.power.minDist)}}}
 // chướng ngại + va chạm
 const pw=sl?C.player.slideW:C.player.w,ph=sl?C.player.slideH:C.player.h,bx=px()-pw/2,by=P.y-ph,s=C.hitShrink;
 for(const o of obs){o.x+=(-sp+o.vx)*dt;if(OB[o.k].f)o.y=o.by+Math.sin(t*3+o.ph)*OB[o.k].f;
  const ox=o.x+o.w*s/2,oy=o.y+o.h*s/2,ow=o.w*(1-s),oh=o.h*(1-s);
  if(!o.dead&&bx<ox+ow&&bx+pw>ox&&by<oy+oh&&by+ph>oy){if(dm||superT>0)brk(o,!dm);else{die();return}}}
 for(const d of ds){d.x+=C.dart.speed*dt;d.r+=dt*20;for(const o of obs)if(!o.dead&&d.x>o.x&&d.x<o.x+o.w&&d.y>o.y&&d.y<o.y+o.h){brk(o,!dm);d.x=999}}
 for(const k of pk){k.x-=sp*dt;if(Math.abs(k.x+6-px())<12&&Math.abs(k.y+6-(P.y-ph/2))<ph/2+8){k.dead=1;pick(k.k)}}
 ds=ds.filter(d=>d.x<W+10);obs=obs.filter(o=>!o.dead&&o.x>-40);pk=pk.filter(k=>!k.dead&&k.x>-20)}

/* ================= VẼ ================= */
function dObs(o){const x=o.x,y=o.y,w=o.w,h=o.h,k=o.k;
 if(k==='crate'){r(x,y,w,h,'#5c3a14');r(x+1,y+1,w-2,h-2,'#b0752f');r(x+1,y+h/2-1,w-2,2,'#7a4e1c');r(x+w/2-1,y+1,2,h-2)}
 else if(k==='spikes'){for(let i=0;i<w;i+=4){r(x+i,y+5,4,3,'#aab');r(x+i+1,y+2,2,3);r(x+i+1,y,2,2,'#fff')}}
 else if(k==='rock'){r(x+2,y,w-4,h,'#6d6d78');r(x,y+3,w,h-3);r(x+3,y+1,5,2,'#9a9aa6')}
 else if(k==='wheel'){r(x+3,y,8,h,'#444');r(x,y+3,14,8);r(x+5,y+5,4,4,'#999');
  if((t*8|0)%2){r(x,y,3,3,'#ccc');r(x+11,y,3,3);r(x,y+11,3,3);r(x+11,y+11,3,3)}else{r(x+5,y-2,4,3,'#ccc');r(x+5,y+13,4,3);r(x-2,y+5,3,4);r(x+13,y+5,3,4)}}
 else{r(x,y+2,w,h-2,k==='fly'?'#d33':k==='bob'?'#a6c':'#8899aa');r(x+w/2-3,y-((t*20|0)%2),6,2,'#ddd');r(x+2,y+h,2,2,'#555');r(x+w-4,y+h,2,2);r(x+w/2-1,y+4,2,2,(t*4|0)%2?'#ff0':'#f00')}}
function ninja(ox,oy,m){const X=Math.round(px())+ox,Y=Math.round(P.y)+oy,f=(t*12|0)%2;ctx.fillStyle=m?'#20232e':'#fff';
 if(sl){ctx.fillRect(X-9,Y-6,13,5);ctx.fillRect(X+2,Y-10,6,6);ctx.fillRect(X-12,Y-3,4,3)}
 else if(!P.onG){ctx.fillRect(X-3,Y-22,6,6);ctx.fillRect(X-2,Y-16,4,8);ctx.fillRect(X-5,Y-9,4,4);ctx.fillRect(X+1,Y-9,5,3);ctx.fillRect(X+2,Y-15,6,2)}

 if(save.s.heavyFx)for(let j=0;j<4;j++){const x=((j*110-bg*.08)%(W+60)+W+60)%(W+60)-30,y=14+j*9;r(x,y,26,5,'rgba(255,255,255,.7)');r(x+5,y-3,14,4)}
 for(let x=0;x<W;x+=2){const u=x+bg*.15,v=x+bg*.35;r(x,G-30-7*Math.sin(u*.02+1)-4*Math.sin(u*.05),2,40,sc.h2);r(x,G-16-7*Math.sin(v*.03)-3*Math.sin(v*.08),2,30,sc.h1)}

 {const tb=$('tb'),z=P.darts?'★'+P.darts:'★';if(tb.textContent!==z)tb.textContent=z;tb.style.opacity=P.darts?.9:.35}

function play(){aud();newRun(false);setMode('play');show(null)}
function pause(){if(mode==='play'){setMode('pause');show('pause');I.down=false}}
function resume(){if(mode==='pause'){setMode('play');show(null);last=performance.now()}}
function toMenu(){newRun(true);setMode('menu');show('menu')}
box.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;aud();
 if(a==='play')play();else if(a==='resume')resume();else if(a==='menu')toMenu();else if(a==='back')show('menu');
 else if(a==='set')show('set');
 else if(a==='rec'){$('rs').innerHTML='Điểm cao nhất: '+save.high+'<br>Số lần chơi: '+save.st.plays+'<br>Tổng quãng đường: '+save.st.dist+' m';show('rec')}});

$('ci').textContent=CFG_FROM_FILE?'Config: đã nạp config.js':'Config: dùng mặc định (không có config.js)';

$('day').onchange=e=>{save.s.day=e.target.value;store()};
$('fx').onchange=e=>{save.s.heavyFx=e.target.checked;store()};

addEventListener('resize',rs);rs();

 fpsN++;fpsT+=dt;if(fpsT>=.5){fpsV=Math.round(fpsN/fpsT);fpsN=0;fpsT=0}}
